apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RukmalS92/argocd-learning
    targetRevision: main
    path: apps            # <- this folder contains Application manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd     # child Applications are created in the argocd ns
  syncPolicy:
    automated:
      prune: true         # remove a child yaml from git -> child app is deleted
      selfHeal: true
